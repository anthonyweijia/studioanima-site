    --muted: #6d6353;
    --accent: #7d5c25;
    --accent-bright: #8f6a2e;
    --line: rgba(41, 35, 27, 0.18);
    --glow: rgba(166, 124, 56, 0.12);
    --glow-faint: rgba(166, 124, 56, 0.055);
    --grain-opacity: 0.05;
  }
  :root[data-theme="dark"] {
    --bg: #0a0b10;
    --ink: #efe8d8;
    --ink-2: #c6bfae;
    --muted: #8e93a2;
    --accent: #d9a05b;
    --accent-bright: #e4b276;
    --line: rgba(239, 232, 216, 0.15);
    --glow: rgba(217, 160, 91, 0.17);
    --glow-faint: rgba(217, 160, 91, 0.06);
    --grain-opacity: 0.04;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Gelasio", "Century Schoolbook", "C059", Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: var(--bg); }
  a { color: inherit; }
  .mono {
    font-family: "Courier Prime", "Courier New", monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .grain {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    pointer-events: none;
    z-index: 50;
    opacity: var(--grain-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 240px 240px;
  }

  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px clamp(20px, 4.5vw, 56px);
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }
  .wordmark img { width: 26px; height: auto; display: block; }
  .wordmark span {
    font-size: 15px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }

  .stage {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 24px 140px;
    overflow: clip;
    isolation: isolate;
  }
  .beam {
    position: absolute;
    z-index: -1;
    left: 50%;
    bottom: 10%;
    transform: translateX(-50%);
    width: 130vw;
    height: 44vh;
    pointer-events: none;
    background:
      radial-gradient(52% 30% at 50% 55%, var(--glow) 0%, transparent 58%),
      radial-gradient(30% 15% at 50% 55%, var(--glow) 0%, transparent 66%),
      radial-gradient(78% 44% at 50% 58%, var(--glow-faint) 0%, transparent 64%);
    -webkit-mask-image: linear-gradient(180deg, transparent 2%, #000 30%, #000 58%, transparent 86%);
    mask-image: linear-gradient(180deg, transparent 2%, #000 30%, #000 58%, transparent 86%);
    opacity: 0;
    animation: warmup 2.6s ease-out 0.25s forwards;
  }
  .beam::before {
    content: "";
    position: absolute;
    left: 16%; right: 16%;
    top: 54.5%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glow), transparent);
  }
  @keyframes warmup { to { opacity: 1; } }
  :root[data-theme="light"] .beam::before { display: none; }

  .slug {
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 34px;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(2.1rem, 5vw, 3.6rem);
    line-height: 1.16;
    letter-spacing: -0.005em;
    text-wrap: balance;
    max-width: 16em;
  }
  .sub {
    margin-top: 26px;
    max-width: 30em;
    font-size: clamp(1.02rem, 1.35vw, 1.14rem);
    line-height: 1.66;
    color: var(--ink-2);
    text-wrap: pretty;
  }
  .back {
    display: inline-block;
    margin-top: 44px;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 3px;
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  .back:hover { border-color: var(--accent); color: var(--accent-bright); }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    border-top: 1px solid var(--line);
    padding: 26px clamp(20px, 4.5vw, 56px);
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-size: 10.5px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .beam { animation: none; opacity: 1; }
  }
</style>
</head>
